<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lost and Found</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#efe9e3; --paper:#fff; --soft:#f7f4f1; --ink:#1f1d1b; --muted:#6f6a64; --line:#e6e0d9; --line2:#d6cec5;
  --brand:#d35400; --brand2:#e67e22; --brandsoft:#fdeee2; --brandink:#9a3d00;
  --ok:#1e8a46; --okbg:#e3f5ea; --bad:#c93a2b; --badbg:#fde8e5; --wait:#946200; --waitbg:#fff3cf;
  --r:16px; --f:'IBM Plex Sans Thai Looped','Noto Sans Thai Looped','Sarabun','TH Sarabun New','Tahoma',sans-serif; color-scheme:light;
  --segbg:#ebe5de; --track:#ece7e1; --sec-line:#f3c9a6; --sec-bg:#fffaf5; --sw:#d8d0c7; --ill:#c9bfb4; --frame:#1f1d1b; --okfg:#fff;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f0e0d; --paper:#1d1b19; --soft:#151311; --ink:#f2eee9; --muted:#a59d94; --line:#2f2b27; --line2:#433d37;
  --brand:#e0651a; --brand2:#f08a3e; --brandsoft:#3a2416; --brandink:#ffb37a;
  --ok:#5fd38a; --okbg:#173323; --bad:#ff7a6b; --badbg:#3b1c18; --wait:#ffcf5c; --waitbg:#3a2f12;
  --segbg:#26221f; --track:#2f2b27; --sec-line:#5a3720; --sec-bg:#221a14; --sw:#4a443e; --ill:#5b534b; --frame:#000; --okfg:#0d2617; color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;display:flex;align-items:center;justify-content:center;padding:20px 16px}
button,input,select,textarea{font:inherit;color:inherit}
.phone{width:min(390px,100%);aspect-ratio:9/16;background:var(--soft);border-radius:34px;box-shadow:0 0 0 10px var(--frame),0 24px 60px rgba(0,0,0,.25);overflow:hidden;position:relative;display:flex;flex-direction:column}
@media (max-width:500px){body{padding:0}.phone{width:100%;height:100vh;height:100dvh;aspect-ratio:auto;border-radius:0;box-shadow:none}}
/* header */
.hd{flex:none;display:flex;align-items:center;gap:6px;padding:14px 12px 12px;background:var(--paper);border-bottom:1px solid var(--line);min-height:60px}
.hd h2{flex:1;margin:0;font-size:19px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .ib{width:40px;height:40px;border-radius:12px;border:0;background:none;display:grid;place-items:center;cursor:pointer;color:var(--ink);flex:none}
.hd .ib:hover{background:var(--soft)} .hd .ib svg{width:22px;height:22px}
.hd.brand{background:var(--brand);color:#fff;border:0;padding:18px 18px 16px}
.hd.brand .ib{color:#fff} .hd.brand .ib:hover{background:rgba(255,255,255,.15)}
.hd .sub{display:block;font-size:12.5px;font-weight:400;opacity:.85}
/* body / footer */
.bd{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.bd>*{flex-shrink:0}
.ft{flex:none;display:flex;gap:10px;padding:12px 16px 16px;background:var(--paper);border-top:1px solid var(--line)}
.btn{flex:1;min-height:48px;border-radius:14px;border:1.5px solid var(--line2);background:var(--paper);font-size:15.5px;font-weight:500;cursor:pointer;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff} .btn.pri:hover{background:#bb4a00}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--okfg)} .btn.no{background:var(--paper);border-color:var(--bad);color:var(--bad)}
.btn.sm{min-height:38px;font-size:14px;flex:none;padding:0 14px;border-radius:11px}
.btn svg{width:20px;height:20px}
:focus-visible{outline:3px solid var(--brand2);outline-offset:2px}
/* form */
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.lab{font-size:13.5px;font-weight:500;color:var(--ink)}
.lab small,.field>label small{color:var(--muted);font-weight:400}
.fld{width:100%;border:1.5px solid var(--line2);border-radius:12px;padding:11px 14px;background:var(--paper);font-size:15px;min-height:46px}
.fld:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brandsoft)}
textarea.fld{min-height:76px;resize:vertical}
.fld.err,.q.err{border-color:var(--bad)!important;box-shadow:0 0 0 3px var(--badbg)}
.errtxt{color:var(--bad);font-size:12.5px}
.pw{position:relative}.pw .fld{padding-right:48px}.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;width:36px;height:36px;border-radius:9px;cursor:pointer;color:var(--muted);display:grid;place-items:center}.pw svg{width:20px;height:20px}
.hint{font-size:12.5px;color:var(--muted);line-height:1.55}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.panel.secret{border-color:var(--sec-line);background:var(--sec-bg)}
.ptitle{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14.5px}
.ptitle svg{width:18px;height:18px;color:var(--brand)}
/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 14px;border:1.5px solid var(--line2);border-radius:999px;background:var(--paper);font-size:14px;cursor:pointer;user-select:none}
.chip input:checked+span{background:var(--brandsoft);border-color:var(--brand);color:var(--brandink);font-weight:500}
.chip input:focus-visible+span{outline:3px solid var(--brand2);outline-offset:2px}
.dot{width:14px;height:14px;border-radius:50%;border:1px solid var(--line2);flex:none}
.seg{display:flex;background:var(--segbg);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:9px;min-height:36px;font-size:14px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--paper);color:var(--ink);font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.1)}
/* tiles */
.hello{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;align-items:center;gap:12px}
.av svg{width:22px;height:22px}.av{width:44px;height:44px;border-radius:50%;background:var(--brandsoft);color:var(--brand);display:grid;place-items:center;font-weight:600;font-size:18px;flex:none}
.hello b{display:block;font-weight:600;font-size:16px}.hello small{color:var(--muted);font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{border:1px solid var(--line);background:var(--paper);border-radius:var(--r);padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-height:112px;position:relative}
.tile:hover{border-color:var(--brand2);box-shadow:0 4px 14px rgba(211,84,0,.10)}
.tile .ic{width:40px;height:40px;border-radius:12px;background:var(--brandsoft);color:var(--brand);display:grid;place-items:center}
.tile .ic svg{width:22px;height:22px}
.tile b{font-weight:600;font-size:15px}.tile small{color:var(--muted);font-size:12px;line-height:1.4}
.tile.wide{grid-column:1/-1;flex-direction:row;align-items:center;min-height:0}
.tile.wide .tx{flex:1}
.badge{position:absolute;top:10px;right:10px;background:var(--bad);color:#fff;font-size:12px;font-weight:600;border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;padding:0 6px}
.sec{font-size:13.5px;font-weight:600;color:var(--muted);margin-top:4px;display:flex;justify-content:space-between;align-items:center}
/* list cards */
.item{display:flex;gap:12px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:10px;width:100%;text-align:left;cursor:pointer}
.item:hover{border-color:var(--brand2)}
.item.off{cursor:default;opacity:.65}.item.off:hover{border-color:var(--line)}
.thumb{width:56px;height:56px;border-radius:12px;object-fit:cover;background:var(--soft);flex:none;display:grid;place-items:center;color:var(--muted)}
.thumb svg{width:24px;height:24px}
.item .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.item .t b{font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t small{color:var(--muted);font-size:12.5px}
.chev{color:var(--muted);flex:none}.chev svg{width:18px;height:18px}
.pill{font-size:12px;border-radius:999px;padding:3px 10px;white-space:nowrap;font-weight:500;align-self:flex-start}
.p-wait{background:var(--waitbg);color:var(--wait)}.p-ok{background:var(--okbg);color:var(--ok)}.p-bad{background:var(--badbg);color:var(--bad)}.p-n{background:var(--track);color:var(--muted)}.p-b{background:var(--brandsoft);color:var(--brandink)}
.empty{text-align:center;color:var(--muted);padding:34px 12px;display:flex;flex-direction:column;align-items:center;gap:10px;font-size:14px}
.empty svg{width:46px;height:46px;color:var(--ill)}.empty .ill{width:150px;height:auto;color:inherit}
/* search */
.sbox{position:relative}.sbox svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted)}.sbox .fld{padding-left:44px}
/* detail */
.hero{width:100%;aspect-ratio:4/3;border-radius:var(--r);object-fit:cover;background:var(--paper);border:1px solid var(--line)}
.kv{display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);font-size:14px}
.kv div:last-child{border-bottom:0}.kv span:first-child{color:var(--muted);flex:none}.kv span:last-child{text-align:right;font-weight:500}
.note{display:flex;gap:10px;background:var(--brandsoft);color:var(--brandink);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.5}
.note svg{width:18px;height:18px;flex:none;margin-top:2px}
.note.ok{background:var(--okbg);color:var(--ok)}.note.bad{background:var(--badbg);color:var(--bad)}
/* photos */
.up{border:1.5px dashed var(--line2);border-radius:var(--r);background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-size:13.5px;cursor:pointer;aspect-ratio:3/4;width:150px}
.up:hover{border-color:var(--brand);color:var(--brand)}.up svg{width:28px;height:28px}
.ph{position:relative;width:150px;aspect-ratio:3/4;border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .x{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;display:grid;place-items:center}
.ph .x svg{width:14px;height:14px}
.ph .cap{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.6);color:#fff;font-size:11.5px;border-radius:8px;padding:2px 8px}
.strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:2px}
.strip .ph,.strip .up{width:96px;flex:none}
.cmpimg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmpimg figure{margin:0;display:flex;flex-direction:column;gap:6px}
.cmpimg figcaption{font-size:12.5px;color:var(--muted);text-align:center}
.cmpimg img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;border:1px solid var(--line);cursor:zoom-in}
.noimg{aspect-ratio:3/4;border-radius:12px;border:1.5px dashed var(--line2);display:grid;place-items:center;color:var(--muted);font-size:12.5px;text-align:center;padding:8px}
/* question */
.q{border:1px solid var(--line);background:var(--paper);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;margin:0}
.q legend{float:left;width:100%;padding:0;font-weight:600;font-size:14.5px;margin-bottom:10px}
.q legend small{font-weight:400;color:var(--muted)}
.num{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--brand);color:#fff;font-size:12.5px;margin-right:6px}
/* verify */
.meter{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.meter .top{display:flex;justify-content:space-between;align-items:baseline}
.meter b{font-size:28px;font-weight:600;font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--track);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;border-radius:99px}
table.cmp{width:100%;border-collapse:collapse;font-size:13.5px}
table.cmp th{font-weight:500;color:var(--muted);font-size:12px;text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
table.cmp td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top}
table.cmp tr:last-child td{border-bottom:0}
.y{color:var(--ok);font-weight:600;white-space:nowrap}.n{color:var(--bad);font-weight:600;white-space:nowrap}
/* report */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat small{color:var(--muted);font-size:12.5px}.stat b{display:block;font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.25}
.two{display:flex;gap:10px}.two>*{flex:1;min-width:0}
/* settings */
.lrow{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.lrow:last-child{border-bottom:0}.lrow .t{flex:1;min-width:0}
.icb{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--paper);display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.icb:hover{color:var(--brand);border-color:var(--brand2)}.icb svg{width:17px;height:17px}
.icb.del:hover{color:var(--bad);border-color:var(--bad)}
.switch{position:relative;width:46px;height:28px;flex:none}
.switch input{opacity:0;width:100%;height:100%;margin:0;position:absolute;cursor:pointer;z-index:1}
.switch i{position:absolute;inset:0;background:var(--sw);border-radius:99px;transition:.15s}
.switch i:after{content:'';position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.15s}
.switch input:checked+i{background:var(--brand)}.switch input:checked+i:after{left:21px}
.switch input:focus-visible+i{outline:3px solid var(--brand2);outline-offset:2px}
.unit{position:relative}.unit .fld{padding-right:46px}.unit span{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--muted)}
.rsel{border:1.5px solid var(--line2);border-radius:10px;padding:6px 8px;background:var(--paper);font-size:13px}
/* login */
.lg{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.lg .top{background:var(--brand);color:#fff;padding:44px 24px 34px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;border-radius:0 0 28px 28px}
.lg .logo{background:#fff;border-radius:22px;padding:10px 14px;box-shadow:0 8px 24px rgba(0,0,0,.18)}.lg .logo img{display:block;width:230px;height:auto}
.hd .appic{width:40px;height:40px;border-radius:12px;background:#fff;flex:none;object-fit:cover}
.lg h1{margin:0;font-size:21px;font-weight:600;line-height:1.35}
.lg .top p{margin:0;font-size:13px;opacity:.9}
.lg form{padding:22px 20px;display:flex;flex-direction:column;gap:12px}
.demo{display:flex;flex-direction:column;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:0 20px 20px}
.demo b{font-size:13px;font-weight:600}
.demo .chips button{border:1.5px solid var(--line2);background:var(--soft);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.demo .chips button:hover{border-color:var(--brand);color:var(--brand)}
/* modal & sheet */
.ov{position:absolute;inset:0;background:rgba(25,20,15,.45);display:flex;align-items:center;justify-content:center;padding:24px;z-index:9}
.dlg{background:var(--paper);border-radius:22px;width:100%;padding:22px 20px 18px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.dlg h3{margin:0;font-size:18px;font-weight:600}
.dlg .msg{font-size:14.5px;line-height:1.6;color:var(--muted)}
.dlg .acts{display:flex;gap:10px;width:100%}
.ico{width:56px;height:56px;border-radius:50%;display:grid;place-items:center}
.ico svg{width:30px;height:30px}
.ico.ok{background:var(--okbg);color:var(--ok)}.ico.no{background:var(--badbg);color:var(--bad)}.ico.wait{background:var(--waitbg);color:var(--wait)}.ico.b{background:var(--brandsoft);color:var(--brand)}
.ov.sheet{align-items:flex-end;padding:0}
.ov.sheet .dlg{border-radius:22px 22px 0 0;align-items:stretch;text-align:left}
.opt{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--paper);cursor:pointer;text-align:left}
.opt:hover{border-color:var(--brand2);background:var(--sec-bg)}
.opt .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none}
.opt .ic svg{width:22px;height:22px}
.opt b{display:block;font-weight:600;font-size:15px}.opt small{color:var(--muted);font-size:12.5px}
.zoom{position:absolute;inset:0;background:rgba(0,0,0,.85);z-index:10;display:flex;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
.zoom img{max-width:100%;max-height:100%;border-radius:12px}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:#1f1d1b;color:#fff;font-size:13.5px;padding:9px 16px;border-radius:999px;z-index:11;white-space:nowrap}
@media (prefers-reduced-motion:no-preference){.ov{animation:fd .15s ease-out}.ov.sheet .dlg{animation:up .2s ease-out}@keyframes fd{from{opacity:0}}@keyframes up{from{transform:translateY(40px)}}}
/* screens & motion */
.scr{flex:1;display:flex;flex-direction:column;min-height:0}
.btn,.tile,.item,.chip span,.opt{transition:transform .08s ease,background-color .15s,border-color .15s}
.btn:active,.tile:active,.item:active,.opt:active{transform:scale(.97)}
@media (prefers-reduced-motion:no-preference){
 .scr.fwd{animation:sIn .24s cubic-bezier(.2,.8,.2,1)}.scr.bwd{animation:sBack .24s cubic-bezier(.2,.8,.2,1)}.scr.fade{animation:fd .3s ease-out}
 @keyframes sIn{from{transform:translateX(36px);opacity:0}}@keyframes sBack{from{transform:translateX(-36px);opacity:0}}
 .splash img{animation:pop .6s cubic-bezier(.2,1.4,.4,1)}@keyframes pop{from{transform:scale(.7);opacity:0}}
 .splash.out{animation:fo .35s ease-in forwards}@keyframes fo{to{opacity:0}}}
.splash{position:absolute;inset:0;z-index:20;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.splash img{width:78%;max-width:300px}
.splash .ld{width:44px;height:4px;border-radius:9px;background:#f3e1d3;overflow:hidden;position:relative}
.splash .ld:after{content:'';position:absolute;inset:0;width:40%;background:#d35400;border-radius:9px;animation:ld 1s ease-in-out infinite}
@keyframes ld{0%{left:-40%}100%{left:100%}}
/* timeline */
.tl{display:flex;flex-direction:column;gap:0;padding-left:4px}
.tl .st{display:flex;gap:12px;position:relative;padding-bottom:14px}
.tl .st:last-child{padding-bottom:0}
.tl .st:not(:last-child):before{content:'';position:absolute;left:10px;top:22px;bottom:2px;width:2px;background:var(--line2)}
.tl .st.done:not(:last-child):before{background:var(--brand)}
.tl .dt{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--paper);border:2px solid var(--line2);color:#fff;position:relative;z-index:1}
.tl .dt svg{width:13px;height:13px}
.tl .done .dt{background:var(--brand);border-color:var(--brand)}
.tl .now .dt{border-color:var(--brand);box-shadow:0 0 0 4px var(--brandsoft)}
.tl .now .dt:after{content:'';width:8px;height:8px;border-radius:50%;background:var(--brand)}
.tl .okd .dt{background:var(--ok);border-color:var(--ok)}.tl .badd .dt{background:var(--bad);border-color:var(--bad)}
.tl b{font-weight:500;font-size:14px;display:block}.tl small{color:var(--muted);font-size:12.5px;line-height:1.45;display:block}
.tl .wait b{color:var(--muted)}

/* ===== soft gradient theme ===== */

 return H('รายละเอียดรายการ')+`<div class="bd">${imgOf(it)?`<img class="hero" src="${imgOf(it)}" alt="${esc(it.name)}">`:''}

 <div class="kv"><div><span>ประเภท</span><span>${f?'ของที่พบ':'ของหาย'}</span></div><div><span>หมวดหมู่</span><span>${esc(it.cat)}</span></div>

 ${f?`<div><span>สถานที่ฝาก</span><span>${esc(it.deposit)}</span></div><div><span>เจ้าหน้าที่รับฝาก</span><span>${esc(user(it.receivedBy)?.name||'-')}</span></div>${it.status!=='returned'?`<div><span>เก็บรักษาถึง</span><span>${thd(addDays(it.date,db.retention))}</span></div>`:''}`:''}
 ${it.detail&&!f?`<div><span>รายละเอียด</span><span>${esc(it.detail)}</span></div>`:''}</div>
 ${f?`<div class="note">${I.lock}<span>รายละเอียดที่ใช้ยืนยันความเป็นเจ้าของ เช่น สีและตำหนิ จะไม่แสดงในหน้านี้</span></div>`:''}
 ${!f?`<div class="note">${I.info}<span>หากพบสิ่งของนี้ ติดต่อผู้แจ้งได้ที่ ${esc(user(it.reporter)?.phone||'-')} หรือนำไปฝากที่ห้องกิจการนักศึกษา</span></div>`:''}
 ${mine&&f?`<div class="note">${I.info}<span>คุณเป็นผู้แจ้งรายการนี้ จึงยื่นขอรับคืนไม่ได้</span></div>`:''}
 ${pend?`<div class="note ok">${I.wait}<span>คุณยื่นคำขอรายการนี้แล้วเมื่อ ${thd(pend.date)} กำลังรอเจ้าหน้าที่ตรวจสอบ</span></div>`:''}</div>
 ${canClaim&&!pend?`<div class="ft"><button class="btn pri" type="button" data-a="toClaim">ยื่นคำขอรับของคืน</button></div>`:''}`};
V.claim=()=>{const it=item(cur().id),e=S.f.err||{},a=S.f;const imgs=a.cimgs||[];
 return H('ยื่นคำขอรับคืน')+`<div class="bd"><div class="item off" style="opacity:1">${thumb(it)}<span class="t"><b>${esc(it.name)}</b><small>ตอบคำถามเพื่อยืนยันว่าคุณเป็นเจ้าของ</small></span></div>
 <fieldset class="q${e.qc?' err':''}"><legend><span class="num">1</span>สีของสิ่งของ</legend>${grid(colorChips('qc',a.qc),3)}</fieldset>
 <fieldset class="q${e.qf?' err':''}"><legend><span class="num">2</span>ลักษณะเด่น <small>(เลือกได้หลายข้อ)</small></legend>${grid(FEATS.map(x=>chipC('qf',x,(a.qf||[]).includes(x))).join(''),2)}</fieldset>
 <fieldset class="q${e.qp?' err':''}"><legend><span class="num">3</span>สถานที่ที่คาดว่าทำหาย</legend>${grid(db.places.concat('อื่น ๆ').map(x=>chipR('qp',x,a.qp===x)).join(''),2)}</fieldset>
 <fieldset class="q${e.qr?' err':''}"><legend><span class="num">4</span>วันที่ทำหาย</legend>${dateBtn('qr',a.qr||'','qrL')}<span class="hint" id="qrL">เลือกวันที่คุณคิดว่าทำของหาย ระบบยอมรับคลาดเคลื่อนได้ไม่เกิน 3 วัน</span></fieldset>
 <fieldset class="q"><legend><span class="num">5</span>รูปถ่ายสิ่งของของคุณ <small>(ถ้ามี ไม่เกิน 3 รูป)</small></legend><div class="hint" style="margin-top:-4px">เช่น รูปเก่าที่เคยถ่ายไว้ หรือรูปที่เห็นสิ่งของชิ้นนี้ ช่วยให้เจ้าหน้าที่ตรวจสอบได้ง่ายขึ้น</div>
  <div class="strip" id="cStrip">${claimStrip(imgs)}</div><input type="file" id="cImg" accept="image/*" multiple hidden></fieldset>
 <div class="field"><label for="qn">หมายเหตุเพิ่มเติม <small>(ไม่บังคับ)</small></label><textarea class="fld" id="qn" placeholder="เช่น จุดสังเกตอื่นที่มีแต่เจ้าของรู้">${esc(a.qn||'')}</textarea></div></div>
 <div class="ft"><button class="btn" type="button" data-a="back">ยกเลิก</button><button class="btn pri" type="button" data-a="submitClaim">ส่งคำขอ</button></div>`};
function claimStrip(imgs){return imgs.map((s,k)=>`<div class="ph"><img src="${s}" alt="รูปที่แนบ ${k+1}"><button class="x" type="button" data-a="rmCImg" data-i="${k}" aria-label="ลบรูปที่ ${k+1}">${I.x}</button></div>`).join('')+(imgs.length<3?`<button class="up" type="button" data-a="pickCImg">${I.cam}<span>เพิ่มรูป</span></button>`:'')}
const ck=I.ok.replace('stroke-width="1.9"','stroke-width="3.4"'),cx=I.no.replace('stroke-width="1.9"','stroke-width="3.4"');
const steps=c=>{const it=item(c.item);const s1=`<div class="st done"><span class="dt">${ck}</span><div><b>ยื่นคำขอรับคืน</b><small>${thd(c.date)}${c.imgs?.length?` · แนบรูป ${c.imgs.length} รูป`:''}</small></div></div>`;
 if(c.status==='pending')return s1+`<div class="st now"><span class="dt"></span><div><b>เจ้าหน้าที่กำลังตรวจสอบ</b><small>เทียบคำตอบของคุณกับข้อมูลในระบบ</small></div></div><div class="st wait"><span class="dt"></span><div><b>แจ้งผลการตรวจสอบ</b><small>รอผล</small></div></div>`;
 const s2=`<div class="st done"><span class="dt">${ck}</span><div><b>ตรวจสอบแล้ว</b><small>โดย ${esc(user(c.verifiedBy)?.name||'เจ้าหน้าที่')}</small></div></div>`;
 return s1+s2+(c.status==='approved'?`<div class="st okd"><span class="dt">${ck}</span><div><b style="color:var(--ok)">อนุมัติแล้ว</b><small>ติดต่อรับของได้ที่ ${esc(it.deposit)} พร้อมบัตรนักศึกษาหรือบัตรบุคลากร</small></div></div>`
  :`<div class="st badd"><span class="dt">${cx}</span><div><b style="color:var(--bad)">ไม่อนุมัติ</b><small>เหตุผล: ${esc(c.reason)}</small></div></div>`)};
V.track=()=>{const L=db.claims.filter(c=>c.by===S.me.id).slice().reverse();
 return H('ติดตามสถานะ')+`<div class="bd">${L.length?L.map(c=>{const it=item(c.item);const done=c.status!=='pending';return `<details class="panel trk"${done?'':' open'}><summary><div style="display:flex;gap:12px;align-items:center">${thumb(it)}<div style="flex:1;min-width:0"><b style="font-weight:500">${esc(it.name)}</b><br><small class="hint">${esc(it.place)} · ยื่น ${thd(c.date)}</small></div><div class="sr">${pill(CLSTAT[c.status])}<span class="tg">${I.chev}</span></div></div></summary>
 <div class="tl">${steps(c)}</div></details>`}).join(''):empty('track','ยังไม่มีคำขอรับคืน')}</div>`};
V.pending=()=>{const L=db.claims.filter(c=>c.status==='pending');
 return H('คำขอรอตรวจสอบ')+`<div class="bd">${L.length?L.map(c=>{const it=item(c.item),m=match(c),u=user(c.by);return `<button class="item" type="button" data-go="verify" data-id="${c.id}">${thumb(it)}<span class="t"><b>${esc(it.name)}</b><small>${esc(u.name)} · ยื่น ${thd(c.date)}${c.imgs?.length?' · มีรูปแนบ':''}</small><span class="pill ${m.score>=3?'p-ok':m.score>=2?'p-wait':'p-bad'}">ตรง ${m.score}/4 ข้อ</span></span><span class="chev">${I.chev}</span></button>`}).join(''):empty('verify','ไม่มีคำขอที่รอตรวจสอบ')}</div>`};
V.verify=()=>{const c=db.claims.find(x=>x.id===cur().id),it=item(c.item),m=match(c),u=user(c.by);const col=m.score>=3?'var(--ok)':m.score>=2?'var(--wait)':'var(--bad)';
 const ci=c.imgs||[];
 return H('ตรวจสอบคำขอ')+`<div class="bd"><div class="item off" style="opacity:1">${thumb(it)}<span class="t"><b>${esc(it.name)}</b><small>ผู้ขอ ${esc(u.name)} (${u.id}) · ยื่น ${thd(c.date)}</small></span></div>
 <div class="meter"><div class="top"><span>คำตอบตรงกับข้อมูลในระบบ</span><b style="color:${col}">${m.score}/4</b></div><div class="bar"><i style="width:${m.score*25}%;background:${col}"></i></div></div>
 <div class="panel" style="padding:8px 12px"><table class="cmp"><thead><tr><th>คำถาม</th><th>ผู้ขอตอบ</th><th>ในระบบ</th><th></th></tr></thead><tbody>
 ${m.res.map(r=>`<tr><td>${r[0]}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td class="${r[3]?'y':'n'}">${r[3]?'✓ ตรง':'✗ ไม่ตรง'}</td></tr>`).join('')}</tbody></table></div>
 <div class="panel"><div class="ptitle">${I.photo}เทียบรูปภาพ</div><div class="cmpimg">
  <figure>${imgOf(it)?`<img src="${imgOf(it)}" alt="รูปในระบบ" data-a="zoom" tabindex="0" role="button">`:'<div class="noimg">ไม่มีรูปในระบบ</div>'}<figcaption>รูปที่บันทึกตอนรับฝาก</figcaption></figure>
  <figure>${ci.length?`<img src="${ci[0]}" alt="รูปจากผู้ขอ" data-a="zoom" tabindex="0" role="button">`:'<div class="noimg">ผู้ขอไม่ได้แนบรูป</div>'}<figcaption>รูปจากผู้ขอ${ci.length>1?` (1/${ci.length})`:''}</figcaption></figure></div>
  ${ci.length>1?`<div class="strip">${ci.slice(1).map(s=>`<div class="ph"><img src="${s}" alt="รูปจากผู้ขอ" data-a="zoom" tabindex="0" role="button"></div>`).join('')}</div>`:''}<span class="hint">แตะรูปเพื่อขยาย</span></div>
 ${c.note?`<div class="panel" style="gap:4px"><span class="hint">หมายเหตุจากผู้ขอ</span><span>${esc(c.note)}</span></div>`:''}
 <div class="field"><label for="vr">เหตุผล <small>(จำเป็นเมื่อปฏิเสธ)</small></label><input class="fld" id="vr" placeholder="เช่น คำตอบไม่ตรงกับลักษณะของสิ่งของ"></div>
 <div class="note">${I.info}<span>ก่อนส่งมอบของ ตรวจบัตรของผู้มารับให้ตรงกับผู้ยื่นคำขอ</span></div></div>
 <div class="ft"><button class="btn no" type="button" data-a="reject">${I.no}ปฏิเสธ</button><button class="btn ok" type="button" data-a="approve">${I.ok}อนุมัติ</button></div>`};
const repData=()=>{const m=+(S.f.m??8),y=+(S.f.y??2026);const inM=d=>{const x=new Date(d+'T00:00');return x.getMonth()===m&&x.getFullYear()===y};
 const L=db.items.filter(i=>inM(i.date)).sort((a,b)=>a.date.localeCompare(b.date));
 return {m,y,L,lost:L.filter(i=>i.type==='lost').length,found:L.filter(i=>i.type==='found').length,
  claims:db.claims.filter(c=>inM(item(c.item).date)),ret:L.filter(i=>i.status==='returned').length}};
V.report=()=>{const r=repData();
 return H('รายงานสรุปผล')+`<div class="bd"><div class="two"><select class="fld" id="rm" aria-label="เดือน">${MF().map((t,i)=>`<option value="${i}"${i===r.m?' selected':''}>${t}</option>`).join('')}</select><select class="fld" id="ry" aria-label="ปี">${[2025,2026].map(v=>`<option value="${v}"${v===r.y?' selected':''}>${v+YO()}</option>`).join('')}</select></div>
 <div class="stats"><div class="stat"><small>แจ้งของหาย</small><b>${r.lost}</b></div><div class="stat"><small>ของที่พบ</small><b>${r.found}</b></div><div class="stat"><small>คำขอรับคืน</small><b>${r.claims.length}</b></div><div class="stat"><small>คืนของแล้ว</small><b style="color:var(--ok)">${r.ret}</b></div></div>
 <div class="sec"><span>รายการในเดือน${MF()[r.m]}</span></div>${r.L.length?r.L.map(i=>`<button class="item" type="button" data-go="rdetail" data-id="${i.id}">${thumb(i)}<span class="t"><b>${esc(i.name)}</b><small>${i.type==='lost'?'ของหาย':'ของที่พบ'} · ${thd(i.date)}</small>${pill(stOf(i))}</span><span class="chev">${I.chev}</span></button>`).join(''):empty('report','ไม่มีรายการในเดือนนี้')}</div>

 ${it.type==='found'?`<div><span>สถานที่ฝาก</span><span>${esc(it.deposit)}</span></div><div><span>เจ้าหน้าที่รับฝาก</span><span>${esc(rec?.name||'-')}</span></div>`:''}</div>
 <div class="sec"><span>คำขอรับคืน (${cs.length})</span></div>${cs.length?cs.map(c=>`<div class="panel" style="gap:4px"><div style="display:flex;justify-content:space-between;gap:8px"><b style="font-weight:500">${esc(user(c.by).name)}</b>${pill(CLSTAT[c.status])}</div><span class="hint">ยื่น ${thd(c.date)} · ตรง ${match(c).score}/4 ข้อ${c.verifiedBy?' · โดย '+esc(user(c.verifiedBy).name):''}</span></div>`).join(''):'<div class="hint">ยังไม่มีผู้ยื่นคำขอ</div>'}

V.manage=()=>H('จัดการระบบ')+`<div class="bd"><div class="tiles">${tile('accounts','users','จัดการบัญชี','กำหนดบทบาทผู้ใช้')}${tile('perms','key','สิทธิ์การใช้งาน','เปิด/ปิดเมนูเจ้าหน้าที่')}${tile('settings','manage','ตั้งค่าทั่วไป','สถานที่ หมวดหมู่ ระยะเวลา','',true)}</div></div>`;

 const name=val('iName'),date=val('iDate'),color=$('input[name=iColor]:checked')?.value||'',feats=$$('input[name=iF]:checked').map(x=>x.value);
 const dep=found?val('iDep'):'',stf=found?val('iStaff'):'';
 const bad=[['iName',!name],['iPlace',!val('iPlace')],['iDate',!date||date>today()]].concat(found?[['iColorBox',!color],['iFBox',!feats.length],['iDep',!dep],['iStaff',!stf]]:[]);
 bad.forEach(([id,b])=>{const el=id==='iDate'?$('[data-t=iDate]'):$('#'+id);el?.classList.toggle('err',b)});
 if(bad.some(x=>x[1])){$('#phone .err')?.scrollIntoView({block:'center'});return modal({title:'ข้อมูลไม่ครบ',icon:'no',msg:'กรุณากรอกช่องที่มีกรอบสีแดงให้ครบ'+(date>today()?'<br>วันที่ต้องไม่เกินวันนี้':''),btn:'กลับไปแก้ไข'})}
 const data={name,cat:val('iCat'),place:val('iPlace'),date,detail:val('iDetail')};if(found){data.secret={color,feats};data.deposit=dep;data.receivedBy=stf}
 if(S.f.img!==undefined)data.img=S.f.img;
 if(it){if(data.img==='')delete it.img;Object.assign(it,data);S.stack=[{s:S.me.role==='staff'?'shome':'home'},{s:'mine'}];S.f={};return modal({title:'บันทึกการแก้ไขแล้ว',icon:'ok',msg:'ข้อมูลรายการถูกอัปเดตแล้ว'})}
 db.items.push({id:'I'+(db.seq++),type:kind,reporter:S.me.id,status:'waiting',...data});
 S.f={};modal({title:kind==='lost'?'แจ้งของหายสำเร็จ':'บันทึกของที่พบสำเร็จ',icon:'ok',msg:kind==='lost'?'ระบบบันทึกการแจ้งของหายแล้ว<br>ดูหรือแก้ไขได้ที่ “รายการบันทึก”':'ขอบคุณที่ช่วยเหลือ<br>กรุณานำของไปฝากตามสถานที่ที่ระบุ',btn:'กลับหน้าหลัก',act:'toHome'})}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const cv=$('#phone .ov .cal');if(cv)return cv.closest('.ov').remove();const z=$('.zoom');if(z)return z.remove();if(S.modal){S.modal=null;render()}}
 if((e.key==='Enter'||e.key===' ')&&e.target.matches('img[data-a=zoom]')){e.preventDefault();e.target.click()}});
seed();try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d&&d.items)db=d}catch(e){}

 notes:['Notes',()=>ic(['#fff'],'<rect width="60" height="15" fill="#fcd34d"/><path d="M8 26h44M8 34h44M8 42h44M8 50h30" stroke="#ddd" stroke-width="1.6"/>')],

function drawSpring(){const d=new Date(),loc=LANG==='en'?'en-US':'th-TH';GID=0;
 SPR.innerHTML=`<div class="widget"><div class="wg"><small>${d.toLocaleDateString(loc,{weekday:'long'})}</small><b>${d.getDate()}</b><span>${d.toLocaleDateString(loc,{month:'long',year:'numeric'})}</span></div><div class="wg"><small>${LANG==='en'?'Bangkok':'กรุงเทพฯ'}</small><b>31°</b><span>${LANG==='en'?'Partly cloudy':'มีเมฆบางส่วน'}</span></div></div>
 <div class="apps"><button type="button" class="app ours" data-app="lf" aria-label="Lost and Found"><span class="ai"><img src="${APPIC}" alt=""></span><span>${LANG==='en'?'Lost&Found':'แจ้งของหาย'}</span></button>${['facetime','calendar','photos','camera','mail','notes','reminders','clock','news','tv','podcasts','appstore','maps','weather','settings'].map(appBtn).join('')}</div>
 <div class="sp2"></div><div class="pill2">${I.search}<span>${LANG==='en'?'Search':'ค้นหา'}</span></div>
 <div class="dock">${['phone','safari','messages','music'].map(appBtn).join('')}</div>`}
let OPEN=false;
function openApp(from){const r=from.getBoundingClientRect(),sr=SCR.getBoundingClientRect();P.style.transformOrigin=`${r.left+r.width/2-sr.left}px ${r.top+r.height/2-sr.top}px`;
 P.classList.remove('closing');P.classList.add('open');OPEN=true;HB.classList.add('dark');
 if(!S.me){const sp=document.createElement('div');sp.className='splash';sp.setAttribute('aria-hidden','true');sp.innerHTML=`<img src="${LOGO}" alt=""><span class="ld"></span>`;P.appendChild(sp);setTimeout(()=>{sp.classList.add('out');setTimeout(()=>sp.remove(),400)},1100)}}
function closeApp(){if(!OPEN)return;OPEN=false;HB.classList.remove('dark');P.classList.add('closing');setTimeout(()=>P.classList.remove('open','closing'),matchMedia('(prefers-reduced-motion: reduce)').matches?0:300)}
SPR.addEventListener('click',e=>{const b=e.target.closest('.app');if(!b)return;if(b.dataset.app==='lf')return openApp(b);
 b.classList.remove('bounce');void b.offsetWidth;b.classList.add('bounce');const t=document.createElement('div');t.className='stoast';t.textContent=LANG==='en'?'Demo icon — open Lost&Found to try the app':'ไอคอนตัวอย่าง ลองเปิดแอป “แจ้งของหาย”';SCR.appendChild(t);setTimeout(()=>t.remove(),1600)});
